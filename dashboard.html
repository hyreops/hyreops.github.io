<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hyreops | Command Center</title>
  <meta name="theme-color" content="#0A0A0A" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      font-size: 14px;
      line-height: 1.5;
      color: #F5F2EA;
      background: #0A0A0A;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    :root {
      --cream: #F5F2EA;
      --ink: #0A0A0A;
      --card: #131313;
      --card-hi: #1A1A1A;
      --border: rgba(245, 242, 234, 0.08);
      --border-hi: rgba(245, 242, 234, 0.16);
      --muted: rgba(245, 242, 234, 0.5);
      --dim: rgba(245, 242, 234, 0.32);
      --accent: #B8552C;
      --accent-soft: rgba(184, 85, 44, 0.14);
      --green: #4ADE80;
      --red: #F87171;
      --amber: #FBBF24;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 24px 64px;
    }

    /* Header */
    .topbar {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 24px; margin-bottom: 28px; padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .brand-block .logo {
      font-size: 28px; letter-spacing: -0.025em;
      font-weight: 400; color: var(--cream); margin-bottom: 4px;
    }
    .brand-block .logo b { font-weight: 800; }
    .brand-block .sub {
      font-size: 11px; font-weight: 600; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent);
    }
    .topbar-meta {
      text-align: right;
      font-size: 13px; color: var(--muted);
    }
    .topbar-meta .day {
      font-size: 15px; color: var(--cream); font-weight: 600;
    }
    .topbar-meta .stamp {
      font-family: var(--mono); font-size: 11px;
      color: var(--dim); letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Period toggle */
    .period {
      display: inline-flex; gap: 2px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px; margin-top: 8px;
    }
    .period button {
      background: transparent; border: 0; color: var(--muted);
      padding: 6px 14px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.02em; border-radius: 6px; cursor: pointer;
      font-family: inherit;
    }
    .period button.active {
      background: var(--accent); color: var(--cream);
    }
    .period button:hover:not(.active) { color: var(--cream); }

    /* KPI grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 18px 16px;
      transition: border-color 0.2s ease;
    }
    .kpi:hover { border-color: var(--border-hi); }
    .kpi-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 12px;
    }
    .kpi-value {
      font-family: var(--mono); font-weight: 700; font-size: 30px;
      color: var(--cream); letter-spacing: -0.02em; line-height: 1;
    }
    .kpi-value .unit { font-size: 16px; color: var(--dim); margin-left: 4px; font-weight: 500; }
    .kpi-delta {
      margin-top: 10px; display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
    }
    .kpi-delta.up { background: rgba(74, 222, 128, 0.12); color: var(--green); }
    .kpi-delta.down { background: rgba(248, 113, 113, 0.12); color: var(--red); }
    .kpi-delta.flat { background: rgba(245, 242, 234, 0.08); color: var(--muted); }
    .kpi-delta .compare {
      color: var(--dim); font-weight: 500; margin-left: 4px;
    }

    /* Two-column row */
    .row-2 {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    /* Card */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 22px;
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 22px; gap: 12px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted);
    }
    .card-sub {
      font-size: 12px; color: var(--dim); font-family: var(--mono);
    }

    /* Funnel */
    .funnel { display: flex; flex-direction: column; gap: 8px; }
    .funnel-row {
      display: grid;
      grid-template-columns: 110px 1fr 90px 70px;
      align-items: center;
      gap: 12px;
    }
    .funnel-label {
      font-size: 12px; font-weight: 600; color: var(--cream);
    }
    .funnel-track {
      height: 32px; background: rgba(245, 242, 234, 0.04);
      border-radius: 6px; overflow: hidden; position: relative;
    }
    .funnel-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), #D87C50);
      border-radius: 6px; transition: width 0.6s ease;
    }
    .funnel-count {
      font-family: var(--mono); font-weight: 700; font-size: 15px;
      color: var(--cream); text-align: right;
    }
    .funnel-rate {
      font-family: var(--mono); font-size: 11px; color: var(--dim);
      text-align: right;
    }
    .funnel-summary {
      margin-top: 18px; padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between;
      font-size: 12px;
    }
    .funnel-summary .item .l { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    .funnel-summary .item .v { color: var(--cream); font-family: var(--mono); font-weight: 700; font-size: 16px; margin-top: 2px; }

    /* Goal */
    .goal-block { display: flex; flex-direction: column; gap: 14px; }
    .goal-row .gtop {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px;
    }
    .goal-name { font-size: 13px; font-weight: 600; color: var(--cream); }
    .goal-val {
      font-family: var(--mono); font-size: 13px; color: var(--cream);
    }
    .goal-val .target { color: var(--dim); }
    .goal-track {
      height: 8px; background: rgba(245, 242, 234, 0.06);
      border-radius: 999px; overflow: hidden;
    }
    .goal-fill {
      height: 100%; background: var(--accent); border-radius: 999px;
      transition: width 0.6s ease;
    }
    .goal-fill.done { background: var(--green); }
    .goal-meta {
      font-size: 11px; color: var(--dim); margin-top: 5px;
      font-family: var(--mono);
    }

    /* Activity feed */
    .activity { display: flex; flex-direction: column; }
    .activity-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .activity-item:last-child { border-bottom: 0; }
    .activity-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .ai-lead { background: rgba(74, 222, 128, 0.14); color: var(--green); }
    .ai-call { background: var(--accent-soft); color: var(--accent); }
    .ai-close { background: rgba(251, 191, 36, 0.14); color: var(--amber); }
    .ai-noshow { background: rgba(248, 113, 113, 0.14); color: var(--red); }
    .activity-text {
      font-size: 13px; color: var(--cream); line-height: 1.4;
    }
    .activity-text .who { font-weight: 600; }
    .activity-text .ctx { color: var(--muted); }
    .activity-time {
      font-family: var(--mono); font-size: 11px; color: var(--dim);
      white-space: nowrap;
    }

    /* Clients table */
    .clients-table { width: 100%; border-collapse: collapse; }
    .clients-table th {
      text-align: left;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--border);
    }
    .clients-table td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .clients-table tr:last-child td { border-bottom: 0; }
    .clients-table .client-name { font-weight: 600; color: var(--cream); }
    .clients-table .client-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
    .clients-table .mrr { font-family: var(--mono); font-weight: 700; color: var(--cream); }
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .status-pill::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .status-active { background: rgba(74, 222, 128, 0.12); color: var(--green); }
    .status-active::before { background: var(--green); }
    .status-onboard { background: var(--accent-soft); color: var(--accent); }
    .status-onboard::before { background: var(--accent); }
    .status-pause { background: rgba(245, 242, 234, 0.08); color: var(--muted); }
    .status-pause::before { background: var(--muted); }

    /* Empty state */
    .empty {
      padding: 28px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    /* Footer note */
    .footnote {
      text-align: center; font-size: 11px;
      color: var(--dim); font-family: var(--mono);
      margin-top: 32px; letter-spacing: 0.08em;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 760px) {
      .wrap { padding: 18px 16px 48px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .topbar-meta { text-align: left; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .kpi-value { font-size: 24px; }
      .row-2 { grid-template-columns: 1fr; }
      .funnel-row { grid-template-columns: 90px 1fr 60px 50px; gap: 8px; }
      .funnel-label { font-size: 11px; }
      .clients-table th:nth-child(3), .clients-table td:nth-child(3) { display: none; }
    }
    @media (max-width: 440px) {
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- ============================================================
         DATA CONFIG — UPDATE NUMBERS HERE
         All values flow into the rendered dashboard below.
         When you connect this to GHL API later, this block gets
         replaced with live fetched data.
         ============================================================ -->
    <script>
      const DATA = {
        period: 'this_week', // 'today' | 'this_week' | 'this_month' | 'all_time'
        updatedAt: 'May 20, 2026 - 9:14 AM CT',

        kpis: {
          new_leads:    { value: 0,    delta: 0,    unit: '' },
          calls_booked: { value: 0,    delta: 0,    unit: '' },
          calls_held:   { value: 0,    delta: 0,    unit: '' },
          closes:       { value: 0,    delta: 0,    unit: '' },
          mrr:          { value: 0,    delta: 0,    unit: '$' }
        },

        funnel: [
          { label: 'Form Submits', count: 0 },
          { label: 'Calls Booked', count: 0 },
          { label: 'Calls Held',   count: 0 },
          { label: 'Closes',       count: 0 }
        ],

        goals: [
          { name: 'Monthly Closes', current: 0, target: 8,    type: 'count' },
          { name: 'MRR',            current: 0, target: 15000, type: 'money' },
          { name: 'Calls Held',     current: 0, target: 20,   type: 'count' }
        ],

        activity: [
          // Example formats - leave empty array [] until real activity hits
          // { type: 'lead',   who: 'Jordan M.',   ctx: 'submitted strategy call form',     when: '2h ago' },
          // { type: 'call',   who: 'Sarah K.',    ctx: 'booked Thu 2:00 PM CT',            when: '3h ago' },
          // { type: 'close',  who: 'Mike R.',     ctx: 'signed - Recruiting + Funnel pkg', when: 'yesterday' },
          // { type: 'noshow', who: 'Alex P.',     ctx: 'no-show, rescheduling',            when: 'yesterday' }
        ],

        clients: [
          // Example: { name: 'Acme D2D',  industry: 'Solar - St. Louis', mrr: 2500, status: 'active', since: 'Apr 2026' },
        ]
      };
    </script>
    <!-- ============================================================ -->

    <!-- Topbar -->
    <div class="topbar">
      <div class="brand-block">
        <div class="logo">hyre<b>ops</b></div>
        <div class="sub">Command Center</div>
        <div class="period">
          <button data-period="today">Today</button>
          <button data-period="this_week" class="active">Week</button>
          <button data-period="this_month">Month</button>
          <button data-period="all_time">All</button>
        </div>
      </div>
      <div class="topbar-meta">
        <div class="day" id="meta-day"></div>
      </div>
    </div>

    <!-- KPI Row -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Funnel + Goals -->
    <div class="row-2">
      <div class="card">
        <div class="card-head">
          <div class="card-title">Conversion Funnel</div>
          <div class="card-sub" id="funnel-window">this week</div>
        </div>
        <div class="funnel" id="funnel"></div>
        <div class="funnel-summary">
          <div class="item">
            <div class="l">Book Rate</div>
            <div class="v" id="rate-book">—</div>
          </div>
          <div class="item">
            <div class="l">Show Rate</div>
            <div class="v" id="rate-show">—</div>
          </div>
          <div class="item">
            <div class="l">Close Rate</div>
            <div class="v" id="rate-close">—</div>
          </div>
          <div class="item">
            <div class="l">Lead → Close</div>
            <div class="v" id="rate-overall">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Monthly Goals</div>
          <div class="card-sub" id="goals-month"></div>
        </div>
        <div class="goal-block" id="goals"></div>
      </div>
    </div>

    <!-- Activity + Clients -->
    <div class="row-2">
      <div class="card">
        <div class="card-head">
          <div class="card-title">Recent Activity</div>
          <div class="card-sub">last 7 days</div>
        </div>
        <div class="activity" id="activity"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Active Clients</div>
          <div class="card-sub" id="clients-count">0 active</div>
        </div>
        <div id="clients-wrap"></div>
      </div>
    </div>

    <div class="footnote">
      hyreops command center
    </div>
  </div>

  <script>
    // ---------- Render helpers ----------
    const fmt = (n) => Number(n).toLocaleString('en-US');
    const money = (n) => '$' + Number(n).toLocaleString('en-US');
    const pct = (a, b) => (b === 0 ? '—' : Math.round((a / b) * 100) + '%');

    // ---------- Topbar ----------
    function renderMeta() {
      const now = new Date();
      const day = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('meta-day').textContent = day;
      document.getElementById('goals-month').textContent = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    // ---------- KPI cards ----------
    function renderKpis() {
      const cards = [
        { key: 'new_leads',    label: 'New Leads' },
        { key: 'calls_booked', label: 'Calls Booked' },
        { key: 'calls_held',   label: 'Calls Held' },
        { key: 'closes',       label: 'Closes' },
        { key: 'mrr',          label: 'MRR' }
      ];
      const grid = document.getElementById('kpi-grid');
      grid.innerHTML = cards.map(c => {
        const k = DATA.kpis[c.key];
        const isMoney = k.unit === '$';
        const val = isMoney ? money(k.value) : fmt(k.value);
        const dir = k.delta > 0 ? 'up' : k.delta < 0 ? 'down' : 'flat';
        const arrow = k.delta > 0 ? '↑' : k.delta < 0 ? '↓' : '—';
        const deltaTxt = k.delta === 0 ? 'no change' : (Math.abs(k.delta) + (isMoney ? '' : ''));
        return `
          <div class="kpi">
            <div class="kpi-label">${c.label}</div>
            <div class="kpi-value">${val}</div>
            <div class="kpi-delta ${dir}">
              ${arrow} ${k.delta === 0 ? 'flat' : (isMoney ? money(Math.abs(k.delta)) : Math.abs(k.delta))}
              <span class="compare">vs last ${DATA.period.replace('this_', '').replace('_', ' ')}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ---------- Funnel ----------
    function renderFunnel() {
      const wrap = document.getElementById('funnel');
      const max = Math.max(...DATA.funnel.map(s => s.count), 1);
      wrap.innerHTML = DATA.funnel.map((s, i) => {
        const w = (s.count / max) * 100;
        const prev = i === 0 ? null : DATA.funnel[i - 1].count;
        const rate = prev === null ? '' : (prev === 0 ? '0%' : Math.round((s.count / prev) * 100) + '%');
        return `
          <div class="funnel-row">
            <div class="funnel-label">${s.label}</div>
            <div class="funnel-track"><div class="funnel-fill" style="width: ${w}%"></div></div>
            <div class="funnel-count">${fmt(s.count)}</div>
            <div class="funnel-rate">${rate}</div>
          </div>
        `;
      }).join('');

      const f = DATA.funnel;
      document.getElementById('rate-book').textContent  = pct(f[1].count, f[0].count);
      document.getElementById('rate-show').textContent  = pct(f[2].count, f[1].count);
      document.getElementById('rate-close').textContent = pct(f[3].count, f[2].count);
      document.getElementById('rate-overall').textContent = pct(f[3].count, f[0].count);
    }

    // ---------- Goals ----------
    function renderGoals() {
      const wrap = document.getElementById('goals');
      wrap.innerHTML = DATA.goals.map(g => {
        const isMoney = g.type === 'money';
        const cur = isMoney ? money(g.current) : fmt(g.current);
        const tgt = isMoney ? money(g.target) : fmt(g.target);
        const pctVal = g.target === 0 ? 0 : Math.min(100, (g.current / g.target) * 100);
        const done = pctVal >= 100;
        const remaining = Math.max(0, g.target - g.current);
        const remTxt = remaining === 0
          ? 'GOAL HIT'
          : (isMoney ? money(remaining) + ' to go' : remaining + ' to go');
        return `
          <div class="goal-row">
            <div class="gtop">
              <div class="goal-name">${g.name}</div>
              <div class="goal-val">${cur} <span class="target">/ ${tgt}</span></div>
            </div>
            <div class="goal-track"><div class="goal-fill ${done ? 'done' : ''}" style="width: ${pctVal}%"></div></div>
            <div class="goal-meta">${Math.round(pctVal)}% · ${remTxt}</div>
          </div>
        `;
      }).join('');
    }

    // ---------- Activity ----------
    function renderActivity() {
      const wrap = document.getElementById('activity');
      if (DATA.activity.length === 0) {
        wrap.innerHTML = '<div class="empty">No activity yet. Once leads start flowing, every booking, show, and close will land here.</div>';
        return;
      }
      const iconMap = {
        lead:   { cls: 'ai-lead',   icon: 'L' },
        call:   { cls: 'ai-call',   icon: 'C' },
        close:  { cls: 'ai-close',  icon: '$' },
        noshow: { cls: 'ai-noshow', icon: 'X' }
      };
      wrap.innerHTML = DATA.activity.map(a => {
        const ic = iconMap[a.type] || iconMap.lead;
        return `
          <div class="activity-item">
            <div class="activity-icon ${ic.cls}">${ic.icon}</div>
            <div class="activity-text"><span class="who">${a.who}</span> <span class="ctx">${a.ctx}</span></div>
            <div class="activity-time">${a.when}</div>
          </div>
        `;
      }).join('');
    }

    // ---------- Clients ----------
    function renderClients() {
      const wrap = document.getElementById('clients-wrap');
      const count = DATA.clients.length;
      document.getElementById('clients-count').textContent = count + (count === 1 ? ' client' : ' clients');

      if (count === 0) {
        wrap.innerHTML = '<div class="empty">No active clients yet. Your first close lands here.</div>';
        return;
      }
      wrap.innerHTML = `
        <table class="clients-table">
          <thead>
            <tr><th>Client</th><th>MRR</th><th>Status</th></tr>
          </thead>
          <tbody>
            ${DATA.clients.map(c => `
              <tr>
                <td>
                  <div class="client-name">${c.name}</div>
                  <div class="client-meta">${c.industry || ''}${c.since ? ' · since ' + c.since : ''}</div>
                </td>
                <td class="mrr">${money(c.mrr)}</td>
                <td><span class="status-pill status-${c.status}">${c.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // ---------- Period toggle (UI only for v1) ----------
    document.querySelectorAll('.period button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.period button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const p = btn.dataset.period;
        const map = { today: 'today', this_week: 'this week', this_month: 'this month', all_time: 'all time' };
        document.getElementById('funnel-window').textContent = map[p];
        // Hook live data swap here once API is wired
      });
    });

    // ---------- Init ----------
    renderMeta();
    renderKpis();
    renderFunnel();
    renderGoals();
